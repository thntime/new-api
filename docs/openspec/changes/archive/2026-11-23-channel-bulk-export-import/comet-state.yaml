              proposal: 候选方案：新增 `.nacx` 自描述 JSON 信封（scrypt N=32768,r=8,p=1 + AES-256-GCM，AAD
                固定 `new-api-channel-export:v1`）；导出按前端 ids 顺序查询重排，显式 DTO 白名单排除
                id/时间/余额/用量/other_info，settings 的 5 个凭证字段先 DecryptSecret
                还原，channel_info 只留配置并重算 multi_key_size，状态
                3→1；导入解密后逐条构造、mergeSensitiveOtherSettings
                重新加密、validateChannel/任务插件/request_plugins/空 key 全部校验通过后按数组顺序
                BatchInsertChannels 并 InitChannelCache，任一失败整批回滚；新增
                model.GetChannelsByIds 保序查询，两条 POST 路由用
                authz.ChannelSensitiveWrite，审计 channel.export/channel.import
                只记数量，导出响应 no-store；前端批量栏加导出、更多操作加导入，两个 Dialog 密码框不落
                localStorage，成功后刷新列表并提示数量；后端单测试 TestChannelExportImport 覆盖保序/无
                id/字段/时间/状态/错误密码/篡改/非法项回滚/敏感
                settings，前端单测试覆盖请求/下载/导入/错误/禁用。关键取舍：自描述信封可演进；scrypt 抗
                GPU；AES-GCM 自带完整性；显式 DTO 防字段外泄；全有或全无避免半批数据；POST 避免密码进
                URL。风险：密码丢失不可恢复（UI
                提示）、文件含密钥（整体加密+敏感写权限+no-store）、跨实例插件缺失（整批回滚并报序号）、大文件（仅选中渠道+32MB
                上限）、多行 INSERT 的 id 顺序假设（测试断言严格递增）、格式演进（version/KDF 参数自描述）。Spec
                Patch：无，当前 delta spec 已覆盖全部行为。
              requirementsEvidence:
                ref: docs/openspec/changes/channel-bulk-export-import
              sourceEvidence:
                ref: docs/openspec/changes/channel-bulk-export-import
