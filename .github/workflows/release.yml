name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (leave empty for auto: <upstream-tag>-<date>-<time>)'
        required: false
        type: string
  push:
    branches: [main]
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION=$(git describe --tags)
          else
            UPSTREAM_TAG="$(curl -fsSL --max-time 30 https://api.github.com/repos/QuantumNous/new-api/releases/latest | jq -r '.tag_name // empty' 2>/dev/null || true)"
            if [ -z "$UPSTREAM_TAG" ]; then
              # 未认证 REST API 在共享 runner 上易被限流，回退到 git 协议枚举上游最新 rc 标签（不受限流影响）
              UPSTREAM_TAG="$(git ls-remote --tags --refs https://github.com/QuantumNous/new-api.git 'refs/tags/v1.0.0-rc.*' 2>/dev/null | sed 's|.*refs/tags/||' | sort -V | tail -1)"
            fi
            if [ -z "$UPSTREAM_TAG" ]; then
              echo "::error::无法获取上游最新版本，请通过 workflow_dispatch 手动指定 version"
              exit 1
            fi
            VERSION="${UPSTREAM_TAG}-$(node -e "const{execSync}=require('child_process');const t=+execSync('git show -s --format=%ct HEAD');console.log(new Date((t+28800)*1000).toISOString().replace(/[-T:]/g,'').slice(0,12))")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Fetch upstream for release notes
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch --quiet upstream main
      - name: Generate release notes
        env:
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/translate_release_notes.py --tag "${VERSION%-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]}" --version "$VERSION" --out release-notes.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.VERSION }}
          update_release_body: true
          body_path: release-notes.md
          files: |
            new-api-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION=$(git describe --tags)
          else
            UPSTREAM_TAG="$(curl -fsSL --max-time 30 https://api.github.com/repos/QuantumNous/new-api/releases/latest | jq -r '.tag_name // empty' 2>/dev/null || true)"
            if [ -z "$UPSTREAM_TAG" ]; then
              # 未认证 REST API 在共享 runner 上易被限流，回退到 git 协议枚举上游最新 rc 标签（不受限流影响）
              UPSTREAM_TAG="$(git ls-remote --tags --refs https://github.com/QuantumNous/new-api.git 'refs/tags/v1.0.0-rc.*' 2>/dev/null | sed 's|.*refs/tags/||' | sort -V | tail -1)"
            fi
            if [ -z "$UPSTREAM_TAG" ]; then
              echo "::error::无法获取上游最新版本，请通过 workflow_dispatch 手动指定 version"
              exit 1
            fi
            VERSION="${UPSTREAM_TAG}-$(node -e "const{execSync}=require('child_process');const t=+execSync('git show -s --format=%ct HEAD');console.log(new Date((t+28800)*1000).toISOString().replace(/[-T:]/g,'').slice(0,12))")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Fetch upstream for release notes
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch --quiet upstream main
      - name: Generate release notes
        env:
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/translate_release_notes.py --tag "${VERSION%-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]}" --version "$VERSION" --out release-notes.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-$VERSION
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.VERSION }}
          update_release_body: true
          body_path: release-notes.md
          files: |
            new-api-macos-*
            checksums-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            VERSION=$(git describe --tags)
          else
            UPSTREAM_TAG="$(curl -fsSL --max-time 30 https://api.github.com/repos/QuantumNous/new-api/releases/latest | jq -r '.tag_name // empty' 2>/dev/null || true)"
            if [ -z "$UPSTREAM_TAG" ]; then
              # 未认证 REST API 在共享 runner 上易被限流，回退到 git 协议枚举上游最新 rc 标签（不受限流影响）
              UPSTREAM_TAG="$(git ls-remote --tags --refs https://github.com/QuantumNous/new-api.git 'refs/tags/v1.0.0-rc.*' 2>/dev/null | sed 's|.*refs/tags/||' | sort -V | tail -1)"
            fi
            if [ -z "$UPSTREAM_TAG" ]; then
              echo "::error::无法获取上游最新版本，请通过 workflow_dispatch 手动指定 version"
              exit 1
            fi
            VERSION="${UPSTREAM_TAG}-$(node -e "const{execSync}=require('child_process');const t=+execSync('git show -s --format=%ct HEAD');console.log(new Date((t+28800)*1000).toISOString().replace(/[-T:]/g,'').slice(0,12))")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Fetch upstream for release notes
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch --quiet upstream main
      - name: Generate release notes
        env:
          TRANSLATE_API_BASE: ${{ secrets.TRANSLATE_API_BASE }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/translate_release_notes.py --tag "${VERSION%-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]}" --version "$VERSION" --out release-notes.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-$VERSION.exe
      - name: Generate checksums
        run: sha256sum new-api-*.exe > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.VERSION }}
          update_release_body: true
          body_path: release-notes.md
          files: |
